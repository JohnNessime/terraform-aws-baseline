# Runs the same gates as CI, locally, before the commit exists.
# Install once:  pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      # Blocks the commit if a credential-shaped string is detected.
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args: ["--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"]
      - id: terraform_checkov
        args: ["--args=--config-file __GIT_WORKING_DIR__/.checkov.yaml"]
      - id: terraform_docs
        args: ["--hook-config=--path-to-file=README.md", "--hook-config=--add-to-existing-file=true"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]
