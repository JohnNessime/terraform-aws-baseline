# Static Terraform CI — fmt, validate, tflint, checkov, gitleaks.
#
# No AWS credentials, no `terraform plan`, no cloud access. Every job runs
# offline against the source.
#
# Every action is pinned to a full commit SHA, not a tag. Tags are mutable — an
# attacker who compromises an action repo can move `v4` to a malicious commit,
# and every workflow using `@v4` silently runs it. A SHA can't be moved. The
# trailing comment records the human-readable version Dependabot keeps current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; individual jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/tags
          - modules/vpc
          - modules/iam
          - bootstrap
          - environments/dev
          - environments/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # -backend=false: never touch a real backend or need credentials.
      - run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
      - run: terraform -chdir=${{ matrix.dir }} validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0
      # The token lets tflint pull the AWS ruleset plugin without hitting the
      # anonymous GitHub API rate limit.
      - run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -e
          for d in modules/tags modules/vpc modules/iam bootstrap environments/dev environments/prod; do
            echo "== tflint $d =="
            tflint --chdir="$d" --config="$GITHUB_WORKSPACE/.tflint.hcl"
          done

  # checkov runs in its own workflow (.github/workflows/checkov.yml) so it
  # carries a separate, live status badge.

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — scan every commit, not just the tip

      # The gitleaks binary directly, rather than gitleaks-action. Two reasons:
      #   1. The action scans only the commits in the push event, which it calls
      #      a "partial scan". This repo wants every commit checked, always.
      #   2. On an initial push, event.before is the all-zeros SHA; the action
      #      hands that to git, git writes to stderr, and the action treats any
      #      stderr as fatal — a guaranteed red build on a repo's first push.
      # It also sidesteps the action's licence requirement for org-owned repos.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      # --log-opts=--all walks every ref, so the scan covers the whole history
      # rather than just the current tip. --redact keeps any finding out of the
      # public log: the job fails and tells you where, without reprinting the
      # secret into a world-readable build log.
      - name: Scan full history
        run: gitleaks detect --source . --log-opts=--all --redact --verbose
